name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Korean font for real image verification
        run: |
          python - <<'PYFONT'
          from src.analytics.us_market_chart import _font
          font = _font()
          print({"korean_font_before_install": font.get_file() if font else None})
          PYFONT
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-wqy-zenhei
          test -r /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
          python - <<'PYFONT'
          from src.analytics.us_market_chart import _font
          font = _font()
          assert font is not None, "Korean rendering font is required for image tests"
          print({"korean_font_after_install": font.get_file()})
          PYFONT

      - name: Verify
        run: QWQ_VERIFY_PYTHON="$(command -v python)" bash scripts/dev/verify.sh
